<!-- Lumora master logo. Source of truth for the in-app mark (components/LumoraLogo.tsx)
     and for exporting store icons. Export at 1024x1024 for App Store / Play Store. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="lumoraTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2A17A"/>
      <stop offset="0.55" stop-color="#EA7A53"/>
      <stop offset="1" stop-color="#D65F3C"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="48" height="48" rx="14" fill="url(#lumoraTile)"/>

  <path d="M17 12 L17 30 Q17 32 19 32 L32 32"
        stroke="#FFFFFF" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <circle cx="32" cy="16" r="4" fill="#FFFFFF" opacity="0.92"/>
</svg>
